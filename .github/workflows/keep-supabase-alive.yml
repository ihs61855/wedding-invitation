name: Keep Supabase Alive

on:
  schedule:
    # UTC 기준: 한국 시간 매일 01:17, 09:17, 17:17
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  check-guestbook:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read guestbook from Supabase
        run: node scripts/check-guestbook.cjs
