<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>청첩장 공유 썸네일 원본</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#faf9f6;color:#393d34}
    main{width:1200px;height:630px;display:grid;grid-template-columns:600px 600px;position:relative}
    .photo{position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;object-position:center 72%}
    .photo:after{content:'';position:absolute;inset:18px;border:1px solid #ffffff80;pointer-events:none}
    .text{padding:78px 38px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-family:'Gowun Batang','Batang',serif}
    .text:after{content:'';position:absolute;top:18px;bottom:18px;right:18px;width:564px;border:1px solid #cdd2c2;pointer-events:none}
    p,h1{margin:0}.label{font:11px sans-serif;letter-spacing:4px;color:#7a866c}
    h1{font:40px Georgia,serif;font-weight:400;letter-spacing:4px;margin:24px 0 36px}h1 em{letter-spacing:0;font-size:44px}
    .names{font-size:39px;letter-spacing:3px}.names span{font-size:18px;color:#9a9f8f;vertical-align:middle;margin:0 8px}
    .rule{width:42px;height:1px;background:#b3bca6;margin:30px auto}
    .date{font:24px Georgia;letter-spacing:2px}.time{font-size:19px;margin:10px 0 20px;color:#71786a}.venue{font-size:21px}.closing{font-size:15px;color:#8b917e;margin-top:33px}
  </style>
</head>
<body><main><div class="photo"><img src="./images/main.jpg" alt="푸른 들판의 두 사람"></div><div class="text"><p class="label">WE ARE GETTING MARRIED</p><h1>SAVE <em>the</em> DATE</h1><p class="names">임한솔 <span>＆</span> 장현정</p><div class="rule"></div><p class="date">2027. 03. 06. SAT</p><p class="time">오후 2시 20분</p><p class="venue">어반폴 트레마리스</p><p class="closing">소중한 분들을 초대합니다.</p></div></main></body>
</html>
