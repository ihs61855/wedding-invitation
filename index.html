<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 결혼합니다</title>
  <meta name="description" content="저희의 결혼식에 초대합니다.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f6f2ed;
      color: #433c36;
      font-family: "Malgun Gothic", sans-serif;
      line-height: 1.9;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
      background: #fffdf9;
      min-height: 100vh;
    }

    h1 { font-size: 28px; font-weight: 400; }
    h2 { font-size: 20px; font-weight: 400; }
    section { margin-top: 64px; }
    .label { font-size: 12px; letter-spacing: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="label">WEDDING INVITATION</p>
    <h1>신랑이름 · 신부이름</h1>
    <p>2027년 5월 15일 오후 1시<br>○○웨딩홀 ○층 ○○홀</p>

    <section>
      <h2>소중한 분들을 초대합니다</h2>
      <p>
        서로의 곁에서 함께 걸어가려 합니다.<br>
        저희의 시작을 축복해 주세요.
      </p>
    </section>

    <section>
      <h2>오시는 길</h2>
      <p>○○웨딩홀<br>예식장 주소를 입력하세요.</p>
    </section>
  </main>
</body>
</html>
